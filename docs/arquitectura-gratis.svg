<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 960" width="1720" height="960" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Arquitectura del lakehouse de puntualidad aérea en AWS (plan gratuito)</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#232F3E"/></marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/></marker>
    <marker id="arrowp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E7157B"/></marker>
  </defs>

  <rect width="1720" height="960" fill="#ffffff"/>

  <!-- Marco de la cuenta -->
  <rect x="170" y="45" width="1410" height="860" rx="14" fill="none" stroke="#14B8A6" stroke-width="2.5" stroke-dasharray="9 7"/>
  <text x="190" y="70" font-size="18" font-weight="700" fill="#0F766E">Cuenta AWS · plan gratuito · región us-east-2</text>

  <!-- ===== Flechas ===== -->
  <g fill="none" stroke-width="2.5">
    <!-- flujo principal -->
    <path d="M125,420 L243,420" stroke="#232F3E" marker-end="url(#arrow)"/>
    <path d="M335,420 L443,420" stroke="#232F3E" marker-end="url(#arrow)"/>
    <path d="M535,420 L643,420" stroke="#232F3E" marker-end="url(#arrow)"/>
    <path d="M735,420 L843,420" stroke="#232F3E" marker-end="url(#arrow)"/>
    <path d="M935,420 L1043,420" stroke="#232F3E" marker-end="url(#arrow)"/>
    <path d="M1335,420 L1593,420" stroke="#232F3E" marker-end="url(#arrow)"/>
    <!-- rechazadas a cuarentena -->
    <path d="M585,425 L585,605 L643,605" stroke="#6B7280" stroke-dasharray="6 5" marker-end="url(#arrowg)"/>
    <!-- crawler lee plata y oro: las flechas parten de los BUCKETS (bajo su etiqueta), no de los conectores del job 2 -->
    <path d="M690,515 L690,540 L890,540" stroke="#6B7280" stroke-dasharray="6 5"/>
    <path d="M1090,515 L1090,540 L890,540" stroke="#6B7280" stroke-dasharray="6 5"/>
    <path d="M890,540 L890,568" stroke="#6B7280" stroke-dasharray="6 5" marker-end="url(#arrowg)"/>
    <!-- crawler a catalogo, catalogo a Athena -->
    <path d="M935,615 L1043,615" stroke="#232F3E" marker-end="url(#arrow)"/>
    <path d="M1135,615 L1190,615 L1190,440 L1243,440" stroke="#232F3E" marker-end="url(#arrow)"/>
    <!-- Athena a Quick, Quick al analista -->
    <path d="M1290,373 L1290,313" stroke="#6B7280" stroke-dasharray="6 5" marker-end="url(#arrowg)"/>
    <path d="M1335,265 L1640,265 L1640,373" stroke="#6B7280" stroke-dasharray="6 5" marker-end="url(#arrowg)"/>
    <!-- orquestacion -->
    <path d="M290,373 L290,135 L353,135" stroke="#E7157B" stroke-dasharray="6 5" marker-end="url(#arrowp)"/>
    <path d="M447,135 L643,135" stroke="#E7157B" stroke-dasharray="6 5" marker-end="url(#arrowp)"/>
    <path d="M690,180 L690,235" stroke="#E7157B" stroke-dasharray="6 5"/>
    <path d="M490,235 L890,235" stroke="#E7157B" stroke-dasharray="6 5"/>
    <path d="M490,235 L490,373" stroke="#E7157B" stroke-dasharray="6 5" marker-end="url(#arrowp)"/>
    <path d="M790,235 L790,253" stroke="#E7157B" stroke-dasharray="6 5" marker-end="url(#arrowp)"/>
    <path d="M890,235 L890,373" stroke="#E7157B" stroke-dasharray="6 5" marker-end="url(#arrowp)"/>
    <!-- alertas -->
    <path d="M980,800 L1040,800" stroke="#232F3E" marker-end="url(#arrow)"/>
    <path d="M1110,800 L1170,800" stroke="#232F3E" marker-end="url(#arrow)"/>
  </g>

  <!-- etiquetas de flechas -->
  <g font-size="13" font-style="italic" fill="#4B5563" text-anchor="middle">
    <text x="214" y="398">aws s3 sync</text>
    <text x="545" y="112">por horario o por archivo nuevo</text>
    <text x="890" y="532">lee plata y oro · uno por capa</text>
  </g>

  <!-- ===== Nodos de la fila principal ===== -->
  <g text-anchor="middle">
    <!-- Fuente -->
    <rect x="35" y="375" width="90" height="90" rx="12" fill="#6B7280"/>
    <text x="80" y="427" font-size="20" font-weight="700" fill="#fff">BTS</text>
    <text x="80" y="488" font-size="17" font-weight="700" fill="#232F3E">BTS On-Time</text>
    <text x="80" y="507" font-size="14" fill="#4B5563">CSV mensual +</text>
    <text x="80" y="524" font-size="14" fill="#4B5563">3 tablas de referencia</text>

    <!-- S3 bronce -->
    <rect x="245" y="375" width="90" height="90" rx="12" fill="#3F8624"/>
    <text x="290" y="428" font-size="22" font-weight="700" fill="#fff">S3</text>
    <text x="290" y="488" font-size="17" font-weight="700" fill="#232F3E">S3 · bronce</text>
    <text x="290" y="507" font-size="14" fill="#4B5563">crudo, inmutable</text>

    <!-- Glue job 1 -->
    <rect x="445" y="375" width="90" height="90" rx="12" fill="#8C4FFF"/>
    <text x="490" y="427" font-size="20" font-weight="700" fill="#fff">Glue</text>
    <text x="490" y="488" font-size="17" font-weight="700" fill="#232F3E">Glue job 1</text>
    <text x="490" y="507" font-size="14" fill="#4B5563">PySpark: limpia</text>

    <!-- S3 plata -->
    <rect x="645" y="375" width="90" height="90" rx="12" fill="#3F8624"/>
    <text x="690" y="428" font-size="22" font-weight="700" fill="#fff">S3</text>
    <text x="690" y="488" font-size="17" font-weight="700" fill="#232F3E">S3 · plata</text>
    <text x="690" y="507" font-size="14" fill="#4B5563">Parquet particionado</text>

    <!-- Glue job 2 -->
    <rect x="845" y="375" width="90" height="90" rx="12" fill="#8C4FFF"/>
    <text x="890" y="427" font-size="20" font-weight="700" fill="#fff">Glue</text>
    <text x="890" y="488" font-size="17" font-weight="700" fill="#232F3E">Glue job 2</text>
    <text x="890" y="507" font-size="14" fill="#4B5563">PySpark: modela</text>

    <!-- S3 oro -->
    <rect x="1045" y="375" width="90" height="90" rx="12" fill="#3F8624"/>
    <text x="1090" y="428" font-size="22" font-weight="700" fill="#fff">S3</text>
    <text x="1090" y="488" font-size="17" font-weight="700" fill="#232F3E">S3 · oro</text>
    <text x="1090" y="507" font-size="14" fill="#4B5563">esquema estrella</text>

    <!-- Athena -->
    <rect x="1245" y="375" width="90" height="90" rx="12" fill="#8C4FFF"/>
    <text x="1290" y="427" font-size="17" font-weight="700" fill="#fff">Athena</text>
    <text x="1290" y="488" font-size="17" font-weight="700" fill="#232F3E">Athena</text>
    <text x="1290" y="507" font-size="14" fill="#4B5563">SQL sobre las capas</text>

    <!-- Analista -->
    <rect x="1595" y="375" width="90" height="90" rx="12" fill="#6B7280"/>
    <circle cx="1640" cy="410" r="12" fill="#fff"/>
    <path d="M1618,446 a22,22 0 0 1 44,0 z" fill="#fff"/>
    <text x="1640" y="488" font-size="17" font-weight="700" fill="#232F3E">Analista</text>
    <text x="1640" y="507" font-size="14" fill="#4B5563">consulta y decide</text>

    <!-- Glue Data Quality -->
    <rect x="745" y="255" width="90" height="90" rx="12" fill="#8C4FFF"/>
    <text x="790" y="307" font-size="22" font-weight="700" fill="#fff">DQ</text>
    <text x="790" y="366" font-size="17" font-weight="700" fill="#232F3E">Glue Data Quality</text>
    <text x="790" y="385" font-size="14" fill="#4B5563">valida plata</text>

    <!-- Cuarentena -->
    <rect x="645" y="560" width="90" height="90" rx="12" fill="#3F8624"/>
    <text x="690" y="613" font-size="22" font-weight="700" fill="#fff">S3</text>
    <text x="690" y="671" font-size="17" font-weight="700" fill="#232F3E">Cuarentena</text>
    <text x="690" y="690" font-size="14" fill="#4B5563">rechazadas + motivo</text>

    <!-- Crawler -->
    <rect x="845" y="570" width="90" height="90" rx="12" fill="#8C4FFF"/>
    <text x="890" y="621" font-size="16" font-weight="700" fill="#fff">Crawler</text>
    <text x="890" y="683" font-size="17" font-weight="700" fill="#232F3E">Glue Crawler</text>
    <text x="890" y="702" font-size="14" fill="#4B5563">descubre esquemas</text>

    <!-- Data Catalog -->
    <rect x="1045" y="570" width="90" height="90" rx="12" fill="#8C4FFF"/>
    <text x="1090" y="621" font-size="16" font-weight="700" fill="#fff">Catalog</text>
    <text x="1090" y="683" font-size="17" font-weight="700" fill="#232F3E">Glue Data Catalog</text>
    <text x="1090" y="702" font-size="14" fill="#4B5563">una database por capa</text>

    <!-- Quick (opcional) -->
    <rect x="1245" y="220" width="90" height="90" rx="12" fill="#8C4FFF" fill-opacity="0.8" stroke="#6D28D9" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="1290" y="272" font-size="17" font-weight="700" fill="#fff">Quick</text>
  </g>
  <g text-anchor="end">
    <text x="1235" y="262" font-size="17" font-weight="700" fill="#232F3E">Quick (Free o Plus)</text>
    <text x="1235" y="281" font-size="14" fill="#4B5563">dashboard, opcional</text>
  </g>

  <!-- EventBridge y Step Functions -->
  <g text-anchor="middle">
    <rect x="355" y="90" width="90" height="90" rx="12" fill="#E7157B"/>
    <text x="400" y="142" font-size="20" font-weight="700" fill="#fff">EB</text>
    <text x="400" y="201" font-size="17" font-weight="700" fill="#232F3E">EventBridge</text>
    <text x="400" y="220" font-size="14" fill="#4B5563">regla que dispara</text>

    <rect x="645" y="90" width="90" height="90" rx="12" fill="#E7157B"/>
    <text x="690" y="142" font-size="20" font-weight="700" fill="#fff">SFN</text>
  </g>
  <text x="748" y="131" font-size="17" font-weight="700" fill="#232F3E">Step Functions</text>
  <text x="748" y="151" font-size="14" fill="#4B5563">state machine con Retry y Catch</text>

  <!-- ===== Seguridad y gobierno ===== -->
  <rect x="235" y="735" width="610" height="155" rx="12" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="255" y="762" font-size="17" fill="#374151">Seguridad y gobierno</text>
  <g text-anchor="middle">
    <rect x="280" y="770" width="60" height="60" rx="10" fill="#DD344C"/>
    <text x="310" y="807" font-size="15" font-weight="700" fill="#fff">KMS</text>
    <text x="310" y="852" font-size="15" font-weight="700" fill="#232F3E">KMS key</text>
    <text x="310" y="869" font-size="13" fill="#4B5563">cifra los buckets</text>

    <rect x="415" y="770" width="60" height="60" rx="10" fill="#DD344C"/>
    <text x="445" y="807" font-size="15" font-weight="700" fill="#fff">IAM</text>
    <text x="445" y="852" font-size="15" font-weight="700" fill="#232F3E">IAM role de Glue</text>
    <text x="445" y="869" font-size="13" fill="#4B5563">least privilege</text>

    <rect x="550" y="770" width="60" height="60" rx="10" fill="#8C4FFF"/>
    <text x="580" y="807" font-size="15" font-weight="700" fill="#fff">LF</text>
    <text x="580" y="852" font-size="15" font-weight="700" fill="#232F3E">Lake Formation</text>
    <text x="580" y="869" font-size="13" fill="#4B5563">columna y fila</text>

    <rect x="685" y="770" width="60" height="60" rx="10" fill="#E7157B"/>
    <text x="715" y="807" font-size="14" font-weight="700" fill="#fff">Trail</text>
    <text x="715" y="852" font-size="15" font-weight="700" fill="#232F3E">CloudTrail</text>
    <text x="715" y="869" font-size="13" fill="#4B5563">audita la API</text>
  </g>

  <!-- ===== Operación y costos ===== -->
  <rect x="875" y="735" width="690" height="155" rx="12" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="895" y="762" font-size="17" fill="#374151">Operación y costos</text>
  <g text-anchor="middle">
    <rect x="915" y="770" width="60" height="60" rx="10" fill="#E7157B"/>
    <text x="945" y="807" font-size="15" font-weight="700" fill="#fff">CW</text>
    <text x="945" y="852" font-size="15" font-weight="700" fill="#232F3E">CloudWatch</text>
    <text x="945" y="869" font-size="13" fill="#4B5563">logs y alarma</text>

    <rect x="1045" y="770" width="60" height="60" rx="10" fill="#E7157B"/>
    <text x="1075" y="807" font-size="15" font-weight="700" fill="#fff">SNS</text>
    <text x="1075" y="852" font-size="15" font-weight="700" fill="#232F3E">SNS</text>
    <text x="1075" y="869" font-size="13" fill="#4B5563">topic de avisos</text>

    <rect x="1175" y="770" width="60" height="60" rx="10" fill="#6B7280"/>
    <text x="1205" y="809" font-size="24" font-weight="700" fill="#fff">@</text>
    <text x="1205" y="852" font-size="15" font-weight="700" fill="#232F3E">Tu mail</text>
    <text x="1205" y="869" font-size="13" fill="#4B5563">aviso de falla</text>

    <rect x="1305" y="770" width="60" height="60" rx="10" fill="#3F8624"/>
    <text x="1335" y="809" font-size="24" font-weight="700" fill="#fff">$</text>
    <text x="1335" y="852" font-size="15" font-weight="700" fill="#232F3E">AWS Budgets</text>
    <text x="1335" y="869" font-size="13" fill="#4B5563">alerta de gasto</text>

    <rect x="1435" y="770" width="60" height="60" rx="10" fill="#E7157B"/>
    <text x="1465" y="807" font-size="15" font-weight="700" fill="#fff">CFN</text>
    <text x="1465" y="852" font-size="15" font-weight="700" fill="#232F3E">CloudFormation</text>
    <text x="1465" y="869" font-size="13" fill="#4B5563">un stack por etapa</text>
  </g>

  <!-- ===== Numeración de pasos ===== -->
  <g text-anchor="middle" font-size="14" font-weight="700" fill="#fff">
    <circle cx="185" cy="420" r="13" fill="#232F3E"/><text x="185" y="425">1</text>
    <circle cx="545" cy="135" r="13" fill="#E7157B"/><text x="545" y="140">2</text>
    <circle cx="390" cy="420" r="13" fill="#232F3E"/><text x="390" y="425">3</text>
    <circle cx="745" cy="257" r="13" fill="#8C4FFF"/><text x="745" y="262">4</text>
    <circle cx="772" cy="420" r="13" fill="#232F3E"/><text x="772" y="425">5</text>
    <circle cx="990" cy="615" r="13" fill="#232F3E"/><text x="990" y="620">6</text>
    <circle cx="1190" cy="528" r="13" fill="#232F3E"/><text x="1190" y="533">7</text>
  </g>

  <!-- ===== Leyenda y pie ===== -->
  <g font-size="14" fill="#374151">
    <rect x="190" y="925" width="14" height="14" rx="3" fill="#3F8624"/><text x="210" y="937">Almacenamiento</text>
    <rect x="335" y="925" width="14" height="14" rx="3" fill="#8C4FFF"/><text x="355" y="937">Procesamiento y análisis</text>
    <rect x="525" y="925" width="14" height="14" rx="3" fill="#E7157B"/><text x="545" y="937">Integración y operación</text>
    <rect x="710" y="925" width="14" height="14" rx="3" fill="#DD344C"/><text x="730" y="937">Seguridad</text>
    <rect x="820" y="925" width="14" height="14" rx="3" fill="#6B7280"/><text x="840" y="937">Externo</text>
    <text x="1580" y="937" text-anchor="end">Solo servicios del plan gratuito de AWS · sin Redshift, Kinesis ni Firehose</text>
  </g>
</svg>
